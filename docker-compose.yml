# Local Control Plane Compose. This is NOT the production image.
# NODE_ENV=development; CMD is `yarn start` with app-config.docker.yaml
# (Guest forbidden, samples excluded). Pilot/production must build
# packages/backend/Dockerfile after `yarn build:backend`.
# See docs/operations/pilot-runbook.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      POSTGRES_DB: ${POSTGRES_DATABASE:-pharma_data_factory}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpp} -d ${POSTGRES_DATABASE:-pharma_data_factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    image: pharma-data-factory
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "7007:7007"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpp}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-pharma_data_factory}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_GITHUB_CALLBACK_URL: ${AUTH_GITHUB_CALLBACK_URL:-http://localhost:7007/api/auth/github/handler/frame}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      CREATE_AUTHORIZATION_AUDIT_PATH: ${CREATE_AUTHORIZATION_AUDIT_PATH:-/app/.runtime/create-authorization-audit.jsonl}
    volumes:
      - create_authorization_audit:/app/.runtime
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  create_authorization_audit:
