# Platform policy — the obligations a data product must meet to be released.
#
# The URS says WHAT a product must do. This says under WHICH conditions it may
# be released at all, regardless of its requirements.
#
# Versioned on purpose. A product pins the version it was built against
# (dataprod.platform/policy-version), so a later tightening makes existing
# products visibly outdated instead of silently breaking them. Raise `version`
# when obligations change; keep the old number in `supportedVersions` for as
# long as products built against it may still be released.
#
# Every obligation below is checked against data the platform actually holds —
# see evaluatePlatformPolicy in plugins/composer-backend. Obligations that
# cannot be checked do not belong here; a rule nobody enforces is worse than no
# rule, because it reads as a guarantee.
#
# This starter set is deliberately small. It is owned by the platform's
# governance, not by the code: extend it as the obligations are agreed.
#
# Mirrored into plugins/composer-backend/src/platform-policy.json; the two are
# held identical by platformPolicyParity.test.ts.

version: 1

# Policy versions a product may still be released against. Drop a number here
# to force rebuilt/re-reviewed products; the release gate then reports
# POLICY_VERSION_UNSUPPORTED.
supportedVersions:
  - 1

obligations:
  - id: owner-declared
    title: A released product has a named owner
    appliesTo: all
    check: product-owner-set
    message: >-
      No owner is recorded. A released product needs someone answerable for it.

  - id: data-classification-declared
    title: A released product states how its data is classified
    appliesTo: all
    check: data-classification-set
    message: >-
      No data classification is recorded. Consumers and access controls have no
      basis to decide how this data may be handled.

  - id: gxp-relevance-declared
    title: A released product states whether it is GxP relevant
    appliesTo: all
    check: gxp-relevance-set
    message: >-
      GxP relevance is not recorded. Whether a product falls under GxP is a
      decision that must be made deliberately, not left unanswered.

  - id: gxp-criticality-declared
    title: A GxP-relevant product states its criticality
    appliesTo: gxp
    check: criticality-set
    message: >-
      This product is GxP relevant but records no criticality, so the depth of
      validation it needs cannot be derived.
