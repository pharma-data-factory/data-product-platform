# Docker-Local Override — ersetzt GitHub Auth durch Guest-only.
#
# Verwendung:
#   docker compose (via docker-compose.yml command-Override)
#
# NICHT für Production verwenden. Kein GitHub, kein Audit-Logging.

auth:
  environment: development
  providers:
    guest:
      userEntityRef: user:default/guest

# Was `auth.providers.guest.ownershipEntityRefs`, which the guest sign-in
# resolver reads only when `signInWithCatalogUser` *fails* — and for
# user:default/guest it never does, so the list had no effect and the Docker
# Guest was a VIEWER despite AUTH_GUEST_ROLE=developer in docker-compose.yml.
# One entry, `platform-developers`, was not even a real group: nothing that
# reads this list could have been watching it.
#
# users-backend applies these to the guest row the Catalog projection is
# written from, and refuses to when auth.environment is production — which the
# line above deliberately overrides for this local-only profile.
users:
  guestGroups:
    - guests
    - data-product-developers
    - urs-authors

# Kein GitHub-Integration (verhindert den startup-Fehler)
integrations: {}
