app:
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DATABASE}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  # Must be visible to the frontend so Guest cannot appear after config merge.
  # @visibility frontend
  environment: production
  providers:
    github:
      production:
        # @visibility frontend
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        callbackUrl: ${AUTH_GITHUB_CALLBACK_URL}
        signIn:
          resolvers:
            # Production requires an approved Catalog User. Do not grant
            # unknown GitHub identities Viewer access.
            - resolver: usernameMatchingUserEntityName

permission:
  enabled: true

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    - type: file
      target: ./catalog/entities.yaml
    - type: file
      target: ./platform-components/catalog.yaml
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [Group]
    - type: file
      target: ./catalog/users.seed.yaml
      rules:
        - allow: [User]
    - type: file
      target: ./templates/python-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/node-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/mqtt-connector/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/mqtt-temperature-product/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/rest-equipment-product/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/unified-namespace/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/machine-state-consumer/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/oee-data-product/template.yaml
      rules:
        - allow: [Template]

# Technical-pilot commercial profile. LocalEntitlementProvider is intentional
# until an AWS Marketplace listing exists. This is NOT AWS production.
# If entitlementProvider is aws, verification is fail-closed and these
# localEntitlements are not used. Never mix environment: local with
# entitlementProvider: aws (MIXED_CONFIGURATION denies all grants).
commercial:
  environment: local
  organizationId: internal
  edition: internal
  entitlementProvider: local
  legalDistributionStatus: ${LEGAL_DISTRIBUTION_STATUS:-BLOCKED}
  localEntitlements:
    internal:
      - golden-path.mqtt-temperature
      - golden-path.rest-equipment
      - platform.core
  createAuthorizationAuditPath: ${CREATE_AUTHORIZATION_AUDIT_PATH:-.runtime/create-authorization-audit.jsonl}
  awsMarketplace:
    region: ${AWS_MARKETPLACE_REGION:-}
    productCode: ${AWS_MARKETPLACE_PRODUCT_CODE:-}
