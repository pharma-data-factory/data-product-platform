app:
  baseUrl: ${APP_BASE_URL}

  # NXD-098. The scaffolder's author tools are switched off in production:
  # Template Editor, Actions and Templating Extensions. Golden Paths are
  # authored in `templates/` and reviewed as code, not in a browser editor —
  # and the editor answered everyone but PLATFORM_ADMIN with a 404, because
  # Backstage's RequirePermission renders NotFound when
  # `scaffolder.template.management` is denied. Templates and Tasks stay.
  # Local development keeps all five for template authors.
  #
  # A list in an overlay REPLACES the base list rather than extending it, so
  # the three entries from app-config.yaml are repeated here. The merged
  # result is asserted in committedConfigIntegrity.test.ts.
  extensions:
    - theme:app/light: false
    - theme:app/dark: false
    - search-result-list-item:techdocs: false
    - sub-page:scaffolder/editor: false
    - sub-page:scaffolder/actions: false
    - sub-page:scaffolder/templating-extensions: false

backend:
  baseUrl: ${BACKEND_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # Backstage's own rate limiter, which `rootHttpRouterServiceFactory` already
  # applies to every request — but only as a pass-through while this key is
  # absent, which it was. Until now the only limiting anywhere in the
  # repository was the in-process one guarding entitlement registration.
  #
  # The limit is per client IP, per window, and covers the served app bundle
  # as well as /api, so it is set well above what browsing costs: it is here
  # to stop a runaway script, not to shape traffic. Localhost is exempt by
  # default, which is what the container healthcheck uses.
  #
  # Behind a load balancer, set `backend.trustProxy` as well — otherwise
  # `req.ip` is the proxy for every caller and they all share one bucket.
  # Deliberately not defaulted here: the correct value depends on how many
  # proxies are in front, and guessing it wrong silently trusts a spoofable
  # X-Forwarded-For.
  rateLimit:
    window: { minutes: 1 }
    incomingRequestLimit: ${BACKEND_RATE_LIMIT_PER_MINUTE:-1200}
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
    # Phase 5 closure (Slice 3): the release pipeline posts build provenance
    # to POST /api/composer/baselines/:id/provenance as a service principal.
    #
    # Backstage's own external-access mechanism, configured rather than
    # invented — no new credential type. The token is write-scoped by what the
    # route accepts, not by config: it is the only route in the repository that
    # admits a service principal, and it can only append provenance that is
    # not already there.
    #
    # Omitted entirely when NEXORA_PROVENANCE_TOKEN is unset, which disables
    # external access rather than enabling it with an empty secret.
    externalAccess:
      - type: static
        options:
          token: ${NEXORA_PROVENANCE_TOKEN}
          subject: release-pipeline
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DATABASE}

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  # Must be visible to the frontend so Guest cannot appear after config merge.
  # @visibility frontend
  environment: production
  providers:
    github:
      production:
        # @visibility frontend
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        callbackUrl: ${AUTH_GITHUB_CALLBACK_URL}
        signIn:
          resolvers:
            # Production requires an approved Catalog User. Do not grant
            # unknown GitHub identities Viewer access.
            - resolver: usernameMatchingUserEntityName

permission:
  enabled: true

# Set explicitly, not left to the plugin default. app-config.yaml is layered
# first and sets memory there; without this line that value survives the merge
# and the URS audit trail, signatures and immutability triggers would exist
# only in process memory.
ursComposer:
  persistence:
    mode: postgres

# Validation runs are regulated evidence. The base file leaves this unset for
# local development, which falls back to a JSON file; the backend refuses that
# fallback when auth.environment is production (NXD-090).
validationExpert:
  persistence:
    mode: postgres

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    - type: file
      target: ./catalog/entities.yaml
    - type: file
      target: ./platform-components/catalog.yaml
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [Group]
    # Users are stored in the users-backend database, not in a file. This
    # target is a projection the plugin rewrites from the database at startup
    # and after every change — never the source of truth, and safe to lose.
    # catalog/users.seed.yaml is first-install content only, read once into an
    # empty table; pointing the catalog at it would let a restart undo a role
    # change.
    - type: file
      target: ./catalog/runtime/platform-users.yaml
      rules:
        - allow: [User]
    - type: file
      target: ./templates/python-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/node-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/mqtt-connector/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/mqtt-temperature-product/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/rest-equipment-product/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/unified-namespace/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/machine-state-consumer/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/oee-data-product/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/aas-data-product/template.yaml
      rules:
        - allow: [Template]

# Technical-pilot commercial profile. LocalEntitlementProvider is intentional
# until an AWS Marketplace listing exists. This is NOT AWS production.
# If entitlementProvider is aws, verification is fail-closed and these
# localEntitlements are not used. Never mix environment: local with
# entitlementProvider: aws (MIXED_CONFIGURATION denies all grants).
commercial:
  environment: local
  organizationId: internal
  edition: internal
  entitlementProvider: local
  legalDistributionStatus: ${LEGAL_DISTRIBUTION_STATUS:-BLOCKED}
  localEntitlements:
    internal:
      - golden-path.mqtt-temperature
      - golden-path.rest-equipment
      - platform.core
  createAuthorizationAuditPath: ${CREATE_AUTHORIZATION_AUDIT_PATH:-.runtime/create-authorization-audit.jsonl}
  awsMarketplace:
    region: ${AWS_MARKETPLACE_REGION:-}
    productCode: ${AWS_MARKETPLACE_PRODUCT_CODE:-}
    # Customer entitlement links. Must sit on the mounted volume: the default
    # below is cwd-relative and would otherwise land in the image layer and be
    # lost on redeploy. `assertLinkStoreDurability` refuses to start an AWS
    # Marketplace integration that has no path at all, but it cannot tell a
    # durable path from an ephemeral one — that is what the volume mount in
    # docker-compose.production.yml is for.
    linkStorePath: ${AWS_MARKETPLACE_LINK_STORE_PATH:-.runtime/marketplace-links.json}
