# nginx Konfiguration für den Split-Modus.
#
# Frontend-Container (Port 3000) dient die gebauten React-Dateien und
# leitet alle Backend-API-Aufrufe an den Backend-Container weiter.
# Ohne diesen Proxy-Passthrough würden CORS-Fehler auftreten, weil
# Browser-Requests von http://localhost:3000 an http://localhost:7007
# cross-origin sind.

server {
    listen 80;
    server_name _;

    # Alle statischen Frontend-Assets
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: unbekannte Routen gehen an index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend-API (Backstage Backend)
    location /api/ {
        proxy_pass         http://backend:7007/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backstage Health-Endpunkte
    location /.backstage/ {
        proxy_pass http://backend:7007/.backstage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backstage-interne Endpunkte (Auth-Callback, etc.)
    location /oauth2/ {
        proxy_pass http://backend:7007/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events für Backstage Signals
    location /api/events/ {
        proxy_pass         http://backend:7007/api/events/;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }
}
