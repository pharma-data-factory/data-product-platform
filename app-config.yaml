app:
  title: Nexora
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    - theme:app/light: false
    - theme:app/dark: false
    # Replace the default TechDocs result item so Developer Hub kinds
    # (Platform, Architecture, Golden Path, How-To, Data Product, Contract)
    # visible. Catalog + TechDocs remain the only search indexes.
    - search-result-list-item:techdocs: false

organization:
  name: Nexora

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    # Minimatch patterns. The webpack dev server advertises localhost, 127.0.0.1
    # and [::1]; a single origin string caused browser Guest sign-in to fail
    # with TypeError: Failed to fetch.
    origin:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - 'http://*:3000'
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # File-backed SQLite for local development. `:memory:` is restored through
  # DevDataStore IPC during `repo start` (5s timeout). That IPC saturates when
  # the CLI parent is also compiling the frontend, especially on Windows/OneDrive,
  # and then `core.auth` fails while Search is starting. Production uses Postgres.
  database:
    client: better-sqlite3
    connection:
      directory: .sqlite
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

# URS Composer runs in-memory for local development (matches the SQLite dev DB).
# Production must set mode: postgres.
ursComposer:
  persistence:
    mode: memory
  ai:
    enabled: false
    provider: openai
    baseUrl: https://api.openai.com
    apiKey: ${URS_AI_API_KEY}
    model: gpt-4o-mini

composer:
  ai:
    enabled: false
    provider: openai
    baseUrl: https://api.openai.com
    apiKey: ${COMPOSER_AI_API_KEY}
    model: gpt-4o-mini

integrations:
  github:
    - host: github.com
      # Optional. Anonymous access works for public reads. A GitHub App is
      # required to create repositories from templates. Load it with
      # `yarn start:github` after filling `.env`. Never commit real credentials.
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  environment: development
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # Guest sign-in is NOT defined here. It lives in app-config.guest.yaml and
    # is loaded only when AUTH_GUEST_ENABLED=true is set in .env — see
    # scripts/ona-dev.sh. Without it the login offers GitHub only, which is the
    # default this platform is built around. The sign-in button keys off the
    # presence of auth.providers.guest, so leaving the provider out disables
    # both the button and the backend route rather than only hiding the button.
    #
    # GitHub *user* login. Separate from GitHub App repository publishing in
    # app-config.github.yaml (GITHUB_APP_ID / GITHUB_CLIENT_ID / private key).
    github:
      development:
        # Frontend must see this key. Default config visibility hides it,
        # which made GitHub login look unconfigured even when the backend
        # had a working OAuth App.
        # @visibility frontend
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        callbackUrl: ${AUTH_GITHUB_CALLBACK_URL:-http://localhost:7007/api/auth/github/handler/frame}
        # The GitHub Actions tab needs repo/workflow scopes to read workflow runs.
        additionalScopes:
          - repo
          - workflow
        signIn:
          resolvers:
            # Development-only convenience. Production must not set this.
            # Unknown GitHub users still receive no platform role.
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Domain]
  locations:
    - type: file
      target: ../../catalog/entities.yaml

    - type: file
      target: ../../catalog/platform-apis.yaml

    # Local/demo fixtures only. Production and Docker must not load this.
    - type: file
      target: ../../catalog/samples/entities.yaml

    # Industrial plugin fixtures only. Not live shopfloor data.
    - type: file
      target: ../../catalog/samples/industrial.yaml

    # Model Company catalog entities (synthetic / demo tags). Local/dev only.
    - type: file
      target: ../../model-company/catalog/entities.yaml

    - type: file
      target: ../../platform-components/catalog.yaml

    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [Group]

    - type: file
      target: ../../catalog/users.seed.yaml
      rules:
        - allow: [User]

    - type: file
      target: ../../templates/python-service/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/node-service/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/mqtt-connector/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/mqtt-temperature-product/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/rest-equipment-product/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/unified-namespace/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/machine-state-consumer/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/oee-data-product/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ../../templates/aas-data-product/template.yaml
      rules:
        - allow: [Template]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# RBAC: Community RBAC plugin configuration
# Central role-based access control for all platform plugins
rbac:
  # Disable RBAC during development if needed (default: true)
  # enabled: false
  
# Nexora industrial providers. mock uses in-memory fixtures for local
# development. Remote base URLs are server-side only. Never put credentials here.
nexora:
  providers:
    mode: mock
    connectivity:
      baseUrl: ${NEXORA_CONNECTIVITY_URL:-}
    dataQuality:
      baseUrl: ${NEXORA_DATA_QUALITY_URL:-}
    contracts:
      baseUrl: ${NEXORA_CONTRACTS_URL:-}

# Technical certification overlay. Catalog annotation remains canonical.
dataProducts:
  certification:
    overlayPath: catalog/certification-overrides.json
  # Optional live upstreams for Consumption Framework (never secrets).
  consume:
    baseUrls:
      # Customer Zero — CHECKWEIGHER-01 OEE on Model Company Mosquitto (:41884)
      checkweigher-01-oee: http://127.0.0.1:18080

# Commercial entitlement foundation. AWS Marketplace is one possible
# source. Local provider is the default and requires no secrets.
# Do not put AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY here.
commercial:
  environment: local
  # @visibility frontend
  organizationId: internal
  # @visibility frontend
  edition: internal
  # @visibility frontend
  entitlementProvider: local
  legalDistributionStatus: ${LEGAL_DISTRIBUTION_STATUS:-BLOCKED}
  localEntitlements:
    internal:
      - golden-path.mqtt-temperature
      - golden-path.rest-equipment
      - platform.core
  # Durable Create-authorization records (URS-AUD-001). Not Part 11.
  # Survives process restart. Not a substitute for PostgreSQL Backstage state.
  createAuthorizationAuditPath: ${CREATE_AUTHORIZATION_AUDIT_PATH:-.runtime/create-authorization-audit.jsonl}
  awsMarketplace:
    region: ${AWS_MARKETPLACE_REGION:-}
    productCode: ${AWS_MARKETPLACE_PRODUCT_CODE:-}

# Validation Expert v0.1 — workbench over validation/ artifacts.
# Does not change product validation_status (remains NOT_VALIDATED).
validationExpert:
  validationRoot: validation
  runtimeStorePath: validation/runtime/runs-store.json
  healthBaseUrl: http://127.0.0.1:7007

# Plugin Directory v0.1 — inventory of installed control-plane plugins.
# Optional override when the backend cannot resolve the monorepo root.
pluginDirectory:
  workspaceRoot: .

# Model Company v0.1 — Customer Zero synthetic plant (NON-GxP).
# Does not change product validation_status (remains NOT_VALIDATED).
# Architecture: Control Plane → Scenario Runtime (:18091) → Mosquitto (:41884) → OEE (:18080)
modelCompany:
  factoryPath: model-company/factories/autoinjector-pharma.yaml
  # Paths resolve from process.cwd(). Starting backend from packages/backend
  # writes under packages/backend/.runtime/model-company/ (cwd-relative).
  runtimeStorePath: .runtime/model-company/state.json
  eventsPath: .runtime/model-company/events.jsonl
  # Required for real MQTT publish path (Scenario Runtime relay).
  runtimeBaseUrl: http://127.0.0.1:18091
  # Local Model Company Mosquitto (Compose host port). Runtime container uses mosquitto:1883.
  mqtt:
    brokerUrl: mqtt://127.0.0.1:41884
    host: 127.0.0.1
    port: 41884
  integrations:
    oeeHealthUrl: http://127.0.0.1:18080/health
