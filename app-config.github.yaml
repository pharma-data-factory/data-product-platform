# Golden Path GitHub App configuration for *repository publishing*.
# This is not GitHub user login. User OAuth client values live in
# app-config.yaml / app-config.production.yaml (AUTH_GITHUB_*).
# Do not put AUTH_GITHUB_* values here.
#
# Local: yarn start:github after `.env` contains real GitHub App values.
# Hosted: the production image loads this file. Do not use yarn start:github
# inside the production container.
#
# GitHub Apps can create organization repositories, not personal-account
# repositories. Install the App on pharma-data-factory. Do not commit secrets.

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_CLIENT_ID}
          clientSecret: ${GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_PRIVATE_KEY}
          webhookSecret: ${GITHUB_WEBHOOK_SECRET:-}

users:
  # NXD-108. Keeps GitHub team membership in step with Nexora platform roles.
  # Opt-in per installation and off by default; while off, Nexora asks GitHub
  # for nothing new. When on, the GitHub App above additionally needs
  # Organization → Members: read & write, and every team below must exist.
  #
  # Keys are Nexora platform groups, values one GitHub team slug or a list
  # of them (NXD-112). URS approval groups (urs-*) are refused and stop the
  # backend: approval roles are granted only in Nexora (NXD-107).
  #
  # Runs on the scheduler (one global task, locked) and right after every
  # change in Admin → Users & Roles. Removal before addition; members Nexora
  # does not manage are left alone. See docs/github-setup.md.
  githubTeamSync:
    enabled: ${GITHUB_TEAM_SYNC_ENABLED:-false}
    # NXD-116. Report what a run would change and write nothing — to GitHub,
    # the state table or the audit trail. The first run starts as soon as the
    # sync is enabled, so turn this on with it, read the plan in Admin → Users
    # & Roles, then turn it off.
    dryRun: ${GITHUB_TEAM_SYNC_DRY_RUN:-false}
    organization: ${GITHUB_ORG:-pharma-data-factory}
    schedule:
      frequency: { minutes: 15 }
      timeout: { minutes: 5 }
    teams:
      data-product-developers: nexora-developers
      data-product-owners: nexora-owners
      # Administrators belong in every team, not only their own.
      platform-admins: [nexora-admins, nexora-developers, nexora-owners]
