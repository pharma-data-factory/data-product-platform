###############################################################################
# GMP Compliance Rules for Validation Manager
# Pharma Data Factory - Validation Management Suite
###############################################################################

rules:
  # RULE 1: Versioning
  versioning:
    enabled: true
    description: "Automatic versioning on requirement changes"
    rules:
      - id: "VERSION_ON_CHANGE"
        description: "Every change triggers version update"
        changeMapping:
          MAJOR:
            - gxpRelevance  # Change from Direct/Indirect/Claim-control/None
            - riskLevel     # Change in risk assessment
            - requirementState
          MINOR:
            - description
            - rationale
            - implementationStatus
          PATCH:
            - other_minor_changes
      
      - id: "VERSION_FORMAT"
        description: "Version must be MAJOR.MINOR.PATCH (e.g., 1.0.0)"
        regex: "^\\d+\\.\\d+\\.\\d+$"
      
      - id: "DOCUMENT_VERSION_SYNC"
        description: "Document version = highest requirement version"
        rule: "doc_version >= max(requirement_versions)"

  # RULE 2: Change Control
  changeControl:
    enabled: true
    description: "Change Control Forms required for major changes"
    rules:
      - id: "CC_ON_MAJOR_CHANGE"
        description: "MAJOR changes require Change Control Form"
        changeType: "MAJOR"
        requires:
          - ccForm: true
          - ccFormId: "CC-XXX"
          - ccApproval: true
        
      - id: "QA_APPROVAL_ON_MINOR"
        description: "MINOR changes require QA approval"
        changeType: "MINOR"
        requires:
          - approval: "QA_LEAD"
        
      - id: "AUTO_APPROVE_PATCH"
        description: "PATCH changes are auto-approved"
        changeType: "PATCH"
        requires: []

  # RULE 3: Approval Chain
  approvalChain:
    enabled: true
    description: "Multi-level approval workflow"
    sequence:
      - step: 1
        role: "QA_LEAD"
        description: "QA Review & Acceptance"
        required: true
        allowReject: true
      
      - step: 2
        role: "VALIDATION_LEAD"
        description: "Validation Review & Acceptance"
        required: true
        allowReject: true
      
      - step: 3
        role: "LEGAL"
        description: "Legal/Compliance Review"
        required: true
        allowReject: true
      
      - step: 4
        role: "SIGNATURE"
        description: "Digital Signature & Lock"
        required: true
        allowReject: false

  # RULE 4: Digital Signature
  digitalSignature:
    enabled: true
    description: "Digital signature when all approvals done"
    requirements:
      - id: "ALL_APPROVALS_REQUIRED"
        description: "All approval steps must be APPROVED"
        rule: "approvals.all(status == APPROVED)"
      
      - id: "SHA256_HASH"
        description: "Document integrity via SHA256 hash"
        algorithm: "SHA256"
        hashesContent:
          - id
          - version
          - title
          - description
          - rationale
          - gxpRelevance
          - riskLevel
      
      - id: "TIMESTAMP_AUTHORITY"
        description: "Digital signature from trusted TSA"
        provider: "https://tsa.example.com"
        certificateAlgorithm: "X.509"
      
      - id: "SIGNATURE_VALIDITY"
        description: "Signature valid for 3 years"
        validityPeriod: "3 years"

  # RULE 5: Document Locking
  documentLocking:
    enabled: true
    description: "Signed documents become immutable"
    rules:
      - id: "LOCK_ON_SIGNATURE"
        description: "Document locked when signature applied"
        effect: "READ_ONLY"
        exceptions:
          - role: "PLATFORM_ADMIN"
            action: "UNLOCK_FOR_CHANGE_CONTROL"
      
      - id: "NO_EDIT_WHEN_LOCKED"
        description: "No field editing when document locked"
        restrictedFields: ["all"]

  # RULE 6: Audit Trail
  auditTrail:
    enabled: true
    description: "Immutable audit log of all actions"
    logFields:
      - timestamp: "ISO8601 format"
      - action: "CREATE|READ|UPDATE|DELETE|APPROVE|SIGN|ARCHIVE"
      - actor: "User ID"
      - role: "User role at time of action"
      - changes: "Before/after values for updates"
      - ipAddress: "Source IP"
      - userAgent: "Browser/client info"
    
    retentionRules:
      active: "3 years"
      archive: "7 years"
      immutable: true

  # RULE 7: Document Integrity
  documentIntegrity:
    enabled: true
    description: "Verify document content hasn't changed"
    mechanisms:
      - id: "SHA256_HASH"
        description: "Calculate hash of requirement content"
        algorithm: "SHA256"
        stored: true
        verified: "on_access"
      
      - id: "TIMESTAMP_AUTHORITY"
        description: "External timestamp proves creation date"
        provider: "https://tsa.example.com"
      
      - id: "BACKUP_VERIFICATION"
        description: "Cross-verify with backup copies"
        backupCount: 3
        frequency: "daily"

  # RULE 8: Retention & Archiving
  retention:
    enabled: true
    description: "Document lifecycle management"
    periods:
      active:
        duration: "3 years"
        status: "ACTIVE"
        access: "full"
      
      archive:
        duration: "7 years"
        status: "ARCHIVED"
        access: "read_only"
        location: "archive_storage"
      
      disposal:
        method: "secure_delete"
        verification: "certificate_of_destruction"

  # RULE 9: Traceability Matrix
  traceability:
    enabled: true
    description: "URS → SYS → TDS → Tests mapping"
    requirements:
      - id: "URS_MAPPING"
        description: "Every URS must map to SYS"
        rule: "URS-XXX → SYS-XXX (1:1 mapping)"
      
      - id: "SYS_MAPPING"
        description: "Every SYS must map to TDS"
        rule: "SYS-XXX → TDS-XXX (1:1 mapping)"
      
      - id: "TDS_MAPPING"
        description: "Every TDS must have tests"
        rule: "TDS-XXX → TEST-* (1:n mapping)"
      
      - id: "COMPLETENESS"
        description: "No orphaned requirements"
        rule: "Every requirement has complete chain"
        validateOn: "publish"

  # RULE 10: Access Control
  accessControl:
    enabled: true
    description: "Role-based access to requirements"
    roles:
      QA_LEAD:
        permissions:
          - view_all
          - edit_own
          - approve_qa
          - reject
      
      VALIDATION_LEAD:
        permissions:
          - view_all
          - view_qa_edits
          - approve_validation
          - reject
      
      LEGAL:
        permissions:
          - view_all
          - approve_legal
          - reject
      
      PLATFORM_ADMIN:
        permissions:
          - view_all
          - edit_all
          - unlock_signed
          - override_approval
      
      DEVELOPER:
        permissions:
          - view_approved
          - view_signed
          - view_archived

###############################################################################
# Document Generation Rules
###############################################################################

documentGeneration:
  templates:
    - name: "URS.md"
      description: "User Requirements Specification"
      headers:
        - documentId: "DOC-YYYY-URS-001"
        - version: "auto-calculated"
        - date: "generation_date"
        - status: "DRAFT|APPROVED|SIGNED"
        - author: "auto_populated"
        - retention: "3 years active + 7 years archive"
      
      sections:
        - requirementsSummary
        - groupedByCategory
        - detailedRequirements
      
      footer:
        - approvalSignatureBlock
        - revisionHistory
        - documentControlNotice
        - archiveInformation

    - name: "TDS.md"
      description: "Technical Design Specification"
      headers:
        - documentId: "DOC-YYYY-TDS-001"
        - version: "auto-calculated"
        - date: "generation_date"
        - status: "DRAFT|APPROVED|SIGNED"

    - name: "Traceability-Matrix.md"
      description: "Forward & Reverse Traceability"
      sections:
        - forwardMapping: "URS → SYS → TDS → Tests"
        - reverseMapping: "Tests → TDS → SYS → URS"
        - coverageAnalysis: "Percentage complete"
        - gapAnalysis: "Missing mappings"

  versioningRules:
    documentVersion: "max(requirement_versions)"
    filenamingPattern: "{DocType}-v{version}-{date}.pdf"
    archivePattern: "{DocType}-v{version}-SIGNED-{date}.pdf"

###############################################################################
# Compliance Validation Rules
###############################################################################

validation:
  beforePublish:
    required:
      - title_not_empty
      - description_not_empty
      - rationale_not_empty
      - gxpRelevance_specified
      - riskLevel_specified
      - approvalChain_complete
      - signature_if_status_signed
    
    warnings:
      - traceability_incomplete
      - multiple_versions_in_use
      - unreviewed_changes

  onApprove:
    validateBy: "reviewer_role"
    checks:
      - requirement_scope_appropriate
      - risk_level_justifiable
      - implementation_feasible

  onSign:
    validateBy: "signature_service"
    checks:
      - all_approvals_obtained
      - document_hash_valid
      - timestamp_from_tsa
      - certificate_valid
      - no_pending_changes

###############################################################################
# Enforcement & Audit
###############################################################################

enforcement:
  strictMode: true
  description: "GMP rules are ALWAYS enforced"
  
  violations:
    - action: "BLOCK"
      examples:
        - "Edit locked document"
        - "Skip approval step"
        - "Publish without approvals"
    
    - action: "WARN"
      examples:
        - "Incomplete traceability"
        - "Version mismatch"

audit:
  logAll: true
  logRetention: "7 years"
  immutable: true
  timestampedBy: "trusted_tsa"

###############################################################################
# Disaster Recovery & Backup
###############################################################################

backup:
  enabled: true
  frequency: "daily"
  copies: 3
  locations:
    - "primary_storage"
    - "secondary_storage"
    - "offsite_storage"
  encryption: "AES-256"
  verification: "daily_integrity_check"

###############################################################################
# Configuration Metadata
###############################################################################

metadata:
  version: "1.0.0"
  createdDate: "2026-01-01"
  lastUpdated: "2026-08-25"
  author: "Validation Team"
  status: "APPROVED"
  documentId: "DOC-2026-COMPLIANCE-RULES-001"
  notes: |
    These are the GMP compliance rules that govern the Validation Manager.
    All rules are enforced automatically by the system.
    Any violations are logged to the audit trail.
    Changes to these rules require formal change control.
