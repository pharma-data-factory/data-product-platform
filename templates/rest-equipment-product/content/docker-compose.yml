services:
  ${{ values.name }}:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ${{ values.name }}
      SERVICE_VERSION: ${{ values.version }}
      SQLITE_PATH: /app/data/equipment.db
      SOURCE_API_URL: ${SOURCE_API_URL:-}
      SOURCE_API_TOKEN: ${SOURCE_API_TOKEN:-}
      SOURCE_API_TIMEOUT: ${SOURCE_API_TIMEOUT:-10}
    volumes:
      - equipment-data:/app/data

volumes:
  equipment-data:
