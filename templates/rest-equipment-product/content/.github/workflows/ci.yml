name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    uses: ./.github/workflows/data-product-quality.yml
    with:
      unit-tests: pytest tests/test_health.py tests/test_model.py tests/test_equipment.py tests/test_source.py tests/test_platform_metadata.py
      image-name: ${{ values.name }}
