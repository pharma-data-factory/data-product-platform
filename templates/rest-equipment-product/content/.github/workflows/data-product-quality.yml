name: Data Product Quality Gate

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      lint-command:
        type: string
        default: ruff check app tests dataprod
      unit-tests:
        type: string
        required: true
      contract-tests:
        type: string
        default: pytest tests/test_contract.py
      quality-tests:
        type: string
        default: pytest tests/test_quality.py
      compatibility-tests:
        type: string
        default: pytest tests/test_compatibility.py
      image-name:
        type: string
        required: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ${{ inputs.lint-command }}

      - name: Unit tests
        run: ${{ inputs.unit-tests }}

      - name: Contract tests
        run: ${{ inputs.contract-tests }}

      - name: Data quality tests
        run: ${{ inputs.quality-tests }}

      - name: Compatibility tests
        run: ${{ inputs.compatibility-tests }}

      - name: Docker build
        run: docker build -t ${{ inputs.image-name }}:ci .

      # NXD-122. The per-requirement test outcomes the conftest hooks wrote,
      # for Nexora to read as test evidence. Uploaded even when a test step
      # failed: a failure is evidence too.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-test-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 90

      # Technical CVE scan of installed Python dependencies.
      # Does not prove GxP validation, container hardening, or secret absence.
      - name: Security scan
        run: |
          python -m pip install pip-audit
          pip-audit
