services:
  ${{ values.name }}:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ${{ values.name }}
      SERVICE_VERSION: ${{ values.version }}
      SQLITE_PATH: /app/data/temperatures.db
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: "${{ values.mqttTopic }}"
      TEMPERATURE_MIN: ${TEMPERATURE_MIN:--50}
      TEMPERATURE_MAX: ${TEMPERATURE_MAX:-150}
    volumes:
      - temperature-data:/app/data

volumes:
  temperature-data:
