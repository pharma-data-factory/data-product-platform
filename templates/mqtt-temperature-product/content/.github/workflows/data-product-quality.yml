name: Data Product Quality Gate

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      lint-command:
        type: string
        default: ruff check app tests dataprod
      unit-tests:
        type: string
        required: true
      contract-tests:
        type: string
        default: pytest tests/test_contract.py
      quality-tests:
        type: string
        default: pytest tests/test_quality.py
      compatibility-tests:
        type: string
        default: pytest tests/test_compatibility.py
      image-name:
        type: string
        required: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Fail-closed when Product Composer scaffolded a manifest hash into catalog-info.
      # Unpinned Marketplace creates skip. Technical check only — not GxP validation.
      - name: Manifest pin check
        run: python scripts/check_manifest_pins.py catalog-info.yaml

      # Fail-closed digital thread: URS snapshot ↔ product-manifest binding.
      - name: Digital thread check
        run: python scripts/check_digital_thread.py . "${{ github.ref }}"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ${{ inputs.lint-command }}

      - name: Unit tests
        run: ${{ inputs.unit-tests }}

      - name: Contract tests
        run: ${{ inputs.contract-tests }}

      - name: Data quality tests
        run: ${{ inputs.quality-tests }}

      - name: Compatibility tests
        run: ${{ inputs.compatibility-tests }}

      - name: Docker build
        run: docker build -t ${{ inputs.image-name }}:ci .

      # Technical CVE scan of installed Python dependencies.
      # Does not prove GxP validation, container hardening, or secret absence.
      - name: Security scan
        run: |
          python -m pip install pip-audit
          pip-audit
