apiVersion: platform.nexora.io/v1alpha1
kind: DataProduct
metadata:
  name: ${{ values.name }}
  title: ${{ values.title }}
  description: ${{ values.description }}
spec:
  domain: ${{ values.domain }}
  owner: ${{ values.owner }}
  lifecycle: ${{ values.lifecycle }}
  interfaces:
    - id: query
      type: rest
      path: /api/v1/temperatures
    - id: realtime
      type: stream
      protocol: sse
    - id: source
      type: mqtt
    - id: egress
      type: mqtt
      direction: publish
      topic: products/${{ values.domain }}/${{ values.name }}/temperature-event/v1
  publish:
    enabled: false
    ports:
      - id: mqtt
        type: mqtt
        topic: products/${{ values.domain }}/${{ values.name }}/temperature-event/v1
  contracts:
    outputs:
      - temperature-event-v1
  presentation:
    defaultView: timeseries
    capabilities:
      - table
      - metric-cards
      - timeseries
      - realtime
      - json
      - schema
  validation:
    status: NOT_VALIDATED
