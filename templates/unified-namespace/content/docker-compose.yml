services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ${{ values.name }}:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ${{ values.name }}
      SERVICE_VERSION: ${{ values.version }}
      UNS_ROOT_TOPIC: ${{ values.rootNamespace }}
      UNS_MQTT_HOST: mosquitto
      UNS_MQTT_PORT: "1883"
      UNS_MQTT_USERNAME: ${UNS_MQTT_USERNAME:-}
      UNS_MQTT_PASSWORD: ${UNS_MQTT_PASSWORD:-}
      UNS_MQTT_ENABLED: "true"
    depends_on:
      - mosquitto
