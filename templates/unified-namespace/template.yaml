apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: unified-namespace
  title: Unified Namespace
  description: Reusable Unified Namespace platform component with MQTT, topic contracts, and catalog registration.
  tags:
    - recommended
    - python
    - mqtt
    - platform-component
    - uns
  annotations:
    dataprod.platform/kind: template
    dataprod.platform/certification-status: DEVELOPMENT
    dataprod.platform/category: Platform Components
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/platform-team
  type: platform-component
  parameters:
    - title: Unified Namespace
      required:
        - name
        - description
        - owner
        - rootNamespace
        - environment
        - repoUrl
      properties:
        name:
          title: Name
          type: string
          description: Unique component name. Lowercase letters, digits, and dashes only.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of this Unified Namespace instance.
          ui:widget: textarea
        owner:
          title: Owner
          type: string
          description: Owning user or group in the catalog.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
        ursBaselineId:
          title: URS Baseline
          type: string
          description: >-
            Approved URS baseline this product is built against. Leave empty
            to create the product without one — it can then be built and tested,
            but the release gate will refuse to release it until it references an
            approved baseline.
          ui:field: UrsBaselinePicker
        rootNamespace:
          title: Root Namespace
          type: string
          description: First topic segment. Default is pharma. Do not hard-code a site name here.
          default: pharma
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        environment:
          title: Environment
          type: string
          default: development
          enum:
            - development
            - test
            - production
        repoUrl:
          title: GitHub Organization and Repository
          type: string
          description: Repository created in pharma-data-factory. Enter only the repository name.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - pharma-data-factory
  steps:
    - id: fetch-base
      name: Fetch Unified Namespace skeleton
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: integration-platform
          domain: integration
          lifecycle: experimental
          version: 1.0.0
          rootNamespace: ${{ parameters.rootNamespace }}
          environment: ${{ parameters.environment }}
          destination:
            host: github.com
            owner: pharma-data-factory
            repo: ${{ parameters.name }}
          templateName: unified-namespace
          templateVersion: 1.0.0
          # Always emitted, so an unbound product is explicit in the catalog and
          # can be found rather than merely missing an annotation.
          ursBaselineId: ${{ parameters.ursBaselineId or 'unbound' }}
          # Pinned at creation: a later policy version makes this product
          # visibly outdated instead of silently non-compliant.
          policyVersion: '1'

    # Before anything is published: a URS claim that does not hold must not
    # reach the catalog. Fails the task unless the baseline is APPROVED.
    # "unbound" passes — creating without a URS is allowed, releasing is not.
    - id: verify-urs
      name: Verify URS baseline
      action: nexora:urs:verify-baseline
      input:
        ursBaselineId: ${{ parameters.ursBaselineId or 'unbound' }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=pharma-data-factory&repo=${{ parameters.name }}
        defaultBranch: main
        repoVisibility: private
        gitAuthorName: Data Product Platform
        gitAuthorEmail: platform@localhost
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # The third thing a product is made of: the governed record that versions,
    # baselines, requirements and the release gate hang off. Last on purpose —
    # the repository and the entity are the expensive artifacts, so they are
    # proven before this is written, and a failure here is fixed by re-running
    # (the action is idempotent on the entity ref). It runs as whoever started
    # the task, so it is refused if they may not create products.
    #
    # SERVICE, although the Catalog entity is a platform-component: PRODUCT_TYPES
    # has no platform-component member, and PLATFORM_PRODUCT is reserved for the
    # Nexora-manages-Nexora singleton. The join is by catalogEntityRef, not by
    # type, so the two descriptions coexist — see STATUS.md, where this is
    # recorded as a choice rather than left to be rediscovered as a bug.
    - id: product
      name: Create the product record
      action: nexora:product:create
      input:
        name: ${{ parameters.name }}
        productType: SERVICE
        # This template has no domain parameter. The literal is the one the
        # fetch step pins into the Catalog entity, so the governed record and
        # the entity cannot disagree about which domain this product is in.
        domain: integration
        description: ${{ parameters.description }}
        repositoryUrl: ${{ steps['publish'].output.remoteUrl }}
        catalogEntityRef: ${{ steps['register'].output.entityRef }}
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Governance and release
        url: ${{ steps['product'].output.productUrl }}
