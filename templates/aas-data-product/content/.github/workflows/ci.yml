name: AAS Data Product CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and Format

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with pylint
        run: |
          pip install pylint
          pylint app/ --disable=C0111,C0103,R0913 --exit-zero

      - name: Format check with black
        run: |
          pip install black
          black --check app/ tests/ || true

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    name: Unit Tests

    services:
      mosquitto:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  contract:
    runs-on: ubuntu-latest
    name: Data Contract Validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Validate contract schema
        run: |
          pip install jsonschema
          python -c "
          import json
          with open('contracts/asset-event.schema.json') as f:
              schema = json.load(f)
          print('Contract schema is valid JSON')
          print(f'Required fields: {schema.get(\"required\", [])}')"

  security:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r app/ --exit-zero -f json -o bandit-report.json || true

      - name: Check for secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --force-use-all-plugins || true

  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: [lint, test, contract, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate
    needs: [build]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed quality gate"
            exit 1
          fi
          echo "Quality gate passed"
