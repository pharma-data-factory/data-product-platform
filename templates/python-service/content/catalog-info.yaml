apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.title }}
  description: ${{ values.description }}
  tags:
    - python
    - fastapi
    - microservice
    - service
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}
    dataprod.platform/kind: service
    dataprod.platform/version: ${{ values.version }}
    dataprod.platform/domain: ${{ values.domain }}
    dataprod.platform/certification-status: DEVELOPMENT
    dataprod.platform/template: ${{ values.templateName }}
  links:
    - url: https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}
      title: Repository
      icon: github
spec:
  type: service
  lifecycle: ${{ values.lifecycle }}
  owner: ${{ values.owner }}
  system: ${{ values.system }}
  dependsOn: []
