name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: pytest

      - name: Docker build
        run: docker build -t ${{ values.name }}:ci .

      - name: Security scan
        run: |
          python -m pip install pip-audit
          pip-audit
