apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: machine-state-consumer-data-product
  title: Machine State Consumer Data Product
  description: Composition proof Data Product that consumes machine-state events from Unified Namespace. Not an OEE Golden Path.
  tags:
    - recommended
    - python
    - mqtt
    - fastapi
    - data-product
    - uns
  annotations:
    dataprod.platform/kind: template
    dataprod.platform/certification-status: TESTED
    dataprod.platform/templateVersion: 1.0.0
    dataprod.platform/dataProductStandardVersion: 1.0.0
    dataprod.platform/dataProductSdkVersion: 1.0.0
    dataprod.platform/category: Data Products
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/platform-team
  type: data-product
  parameters:
    - title: Machine State Consumer Data Product
      description: |
        Composition proof · Unified Namespace · machine-state-event · REST latest state.

        This product depends on Unified Namespace. It does not calculate OEE.
      required:
        - name
        - description
        - owner
        - domain
        - unsComponent
        - topicPattern
      properties:
        name:
          title: Data Product Name
          type: string
          description: Unique data product name. Lowercase letters, digits, and dashes only.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of the machine-state consumer.
          ui:widget: textarea
        owner:
          title: Owner
          type: string
          description: Owning user or group for this Data Product.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
        ursBaselineId:
          title: URS Baseline
          type: string
          description: >-
            Approved URS baseline this data product is built against. Leave empty
            to create the product without one — it can then be built and tested,
            but the release gate will refuse to release it until it references an
            approved baseline.
          ui:field: UrsBaselinePicker
        domain:
          title: Domain
          type: string
          default: manufacturing
        unsComponent:
          title: UNS Component
          type: string
          description: Catalog reference of the Unified Namespace platform component.
          default: component:default/unified-namespace
        topicPattern:
          title: Topic Pattern
          type: string
          description: MQTT subscription for machine-state events. Use + as a single-level wildcard.
          default: pharma/+/+/+/+/machine/state
  steps:
    # The organisation is the platform's, not the template's and not the
    # browser's. Resolved server-side so a caller driving the scaffolder over
    # the API cannot publish somewhere else. NXD-079.
    - id: resolve-repo
      name: Resolve the repository coordinate
      action: nexora:scm:resolve-repo
      input:
        repo: ${{ parameters.name }}

    - id: fetch-base
      name: Fetch Machine State Consumer skeleton
      action: fetch:template
      input:
        url: ./content
        copyWithoutTemplating:
          - .github/workflows/data-product-quality.yml
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          domain: ${{ parameters.domain }}
          unsComponent: ${{ parameters.unsComponent }}
          topicPattern: ${{ parameters.topicPattern }}
          system: data-platform
          lifecycle: experimental
          version: 1.0.0
          destination:
            host: ${{ steps['resolve-repo'].output.host }}
            owner: ${{ steps['resolve-repo'].output.owner }}
            repo: ${{ parameters.name }}
          templateName: machine-state-consumer-data-product
          templateVersion: 1.0.0
          # Always emitted, so an unbound product is explicit in the catalog and
          # can be found rather than merely missing an annotation.
          ursBaselineId: ${{ parameters.ursBaselineId or 'unbound' }}
          # Pinned at creation: a later policy version makes this product
          # visibly outdated instead of silently non-compliant.
          policyVersion: '1'
    # Before anything is published: a URS claim that does not hold must not
    # reach the catalog. Fails the task unless the baseline is APPROVED.
    # "unbound" passes — creating without a URS is allowed, releasing is not.
    - id: verify-urs
      name: Verify URS baseline
      action: nexora:urs:verify-baseline
      input:
        ursBaselineId: ${{ parameters.ursBaselineId or 'unbound' }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ steps['resolve-repo'].output.repoUrl }}
        defaultBranch: main
        repoVisibility: private
        gitAuthorName: Data Product Platform
        gitAuthorEmail: platform@localhost
    - id: register
      name: Register Data Product
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # The third thing a product is made of: the governed record that versions,
    # baselines, requirements and the release gate hang off. Last on purpose —
    # the repository and the entity are the expensive artifacts, so they are
    # proven before this is written, and a failure here is fixed by re-running
    # (the action is idempotent on the entity ref). It runs as whoever started
    # the task, so it is refused if they may not create products.
    - id: product
      name: Create the product record
      action: nexora:product:create
      input:
        name: ${{ parameters.name }}
        productType: DATA_PRODUCT
        domain: ${{ parameters.domain }}
        description: ${{ parameters.description }}
        repositoryUrl: ${{ steps['publish'].output.remoteUrl }}
        catalogEntityRef: ${{ steps['register'].output.entityRef }}
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View Data Product
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Governance and release
        url: ${{ steps['product'].output.productUrl }}
