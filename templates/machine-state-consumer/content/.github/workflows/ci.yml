name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this same gate before it builds (NXD-132).
  workflow_call:
  # The AI build starts this gate on its branch: a pull request it opens with
  # GITHUB_TOKEN starts no pull_request run (NXD-153).
  workflow_dispatch:

jobs:
  quality-gate:
    uses: ./.github/workflows/data-product-quality.yml
    with:
      lint-command: ruff check app tests dataprod scripts && python -m compileall -q app scripts
      unit-tests: pytest tests/test_health.py tests/test_model.py tests/test_machines.py tests/test_mqtt.py tests/test_platform_metadata.py tests/test_release.py tests/test_ai_build.py
      image-name: ${{ values.name }}
