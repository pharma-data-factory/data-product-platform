name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest

      - name: Build
        run: pip install .

      - name: Docker build
        run: docker build -t ${{ values.name }}:ci .

      - name: Security scan
        run: pip-audit
