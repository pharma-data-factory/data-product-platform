services:
  ${{ values.name }}:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ${{ values.name }}
      SERVICE_VERSION: ${{ values.version }}
      EQUIPMENT_ID: ${{ values.equipmentId }}
      SITE: "${{ values.site }}"
      AREA: "${{ values.area }}"
      LINE: "${{ values.line }}"
      DEFAULT_WINDOW: ${{ values.defaultWindow }}
      TIMESERIES_SQLITE_PATH: /app/data/oee.db
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: "${{ values.mqttTopic }}"
      MACHINE_STATE_TOPIC: "${{ values.machineStateTopic }}"
      COUNTER_TOPIC: "${{ values.counterTopic }}"
      SOURCE_API_URL: ${SOURCE_API_URL:-}
      SOURCE_API_TOKEN: ${SOURCE_API_TOKEN:-}
    volumes:
      - oee-data:/app/data

volumes:
  oee-data:
