asyncapi: 3.0.0
info:
  title: ${{ values.title }} MQTT inputs
  version: "1.0.0"
  description: |
    Incoming machine events for OEE Data Product 1.0.
    Topics are configured in Create. Do not hardcode a site topic.
    One MQTT message is not a complete calculation window.
defaultContentType: application/json
channels:
  machineState:
    address: ${{ values.machineStateTopic }}
    messages:
      machineStateEvent:
        $ref: "#/components/messages/machineStateEvent"
  counters:
    address: ${{ values.counterTopic }}
    messages:
      counterEvent:
        $ref: "#/components/messages/counterEvent"
# This product receives both streams; it publishes nothing over MQTT.
operations:
  receiveMachineState:
    action: receive
    channel:
      $ref: "#/channels/machineState"
    messages:
      - $ref: "#/channels/machineState/messages/machineStateEvent"
  receiveCounters:
    action: receive
    channel:
      $ref: "#/channels/counters"
    messages:
      - $ref: "#/channels/counters/messages/counterEvent"
components:
  messages:
    machineStateEvent:
      name: machine-state-event
      summary: Machine state events
      payload:
        type: object
        required: [equipmentId, state, timestamp]
        properties:
          equipmentId:
            type: string
          state:
            type: string
            enum: [RUNNING, STOPPED, IDLE, MAINTENANCE]
          timestamp:
            type: string
            format: date-time
          reasonCode:
            type: string
            description: Diagnostic only. Does not change A, P, Q, or OEE.
          reason:
            type: string
    counterEvent:
      name: counter-event
      summary: Cumulative counter events
      payload:
        type: object
        required: [equipmentId, timestamp, totalCount]
        properties:
          equipmentId:
            type: string
          timestamp:
            type: string
            format: date-time
          totalCount:
            type: integer
            minimum: 0
          goodCount:
            type: integer
            minimum: 0
          rejectCount:
            type: integer
            minimum: 0
