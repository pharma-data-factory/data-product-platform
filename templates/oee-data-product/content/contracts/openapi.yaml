openapi: 3.0.3
info:
  title: ${{ values.title }}
  version: "1.0.0"
  description: |
    OEE Data Product 1.0 result API.
    OEE = Availability × Performance × Quality for one equipmentId and an explicit interval.
    Missing inputs yield calculationStatus and null ratios. Never guessed.
    CERTIFIED on the Golden Path is technical platform status only. It is not GxP validation.
    MES remains System of Record. This API does not access MES/ERP/LIMS/EWM databases.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: Service process is up
  /health/ready:
    get:
      summary: Readiness including MQTT, REST source, and storage
      responses:
        "200":
          description: Ready or degraded checks
  /api/v1/oee:
    get:
      summary: Calculate OEE for the configured or requested equipment
      parameters:
        - $ref: "#/components/parameters/equipmentId"
        - $ref: "#/components/parameters/window"
        - $ref: "#/components/parameters/windowType"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
      responses:
        "200":
          description: One OEE result wrapped in a list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OeeResult"
        "400":
          description: Invalid window
        "404":
          description: Unknown equipment
        "503":
          description: Storage unavailable
  /api/v1/oee/{equipmentId}:
    get:
      summary: Calculate OEE for one named equipment and explicit interval
      parameters:
        - name: equipmentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/window"
        - $ref: "#/components/parameters/windowType"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
      responses:
        "200":
          description: OEE result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OeeResult"
  # Added from the app's generated schema (NXD-132). Request and response
  # shapes are as precise as the route declares them; most return untyped JSON.
