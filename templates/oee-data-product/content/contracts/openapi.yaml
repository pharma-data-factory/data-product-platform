        type: string
        enum: [hour, shift, order, custom, HOUR, SHIFT, ORDER, CUSTOM]
    windowType:
      name: windowType
      in: query
      schema:
        type: string
        enum: [HOUR, SHIFT, ORDER, CUSTOM, hour, shift, order, custom]
    from:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    to:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    start:
      name: start
      in: query
      schema:
        type: string
        format: date-time
    end:
      name: end
      in: query
      schema:
        type: string
        format: date-time
  schemas:
    OeeResult:
      type: object
      required: [equipmentId, calculationStatus]
      properties:
        equipmentId:
          type: string
        window:
          type: object
          properties:
            type:
              type: string
              enum: [HOUR, SHIFT, ORDER, CUSTOM]
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        context:
          type: object
          description: Optional production context. Not all fields are required to calculate OEE.
          properties:
            site: { type: string, nullable: true }
            area: { type: string, nullable: true }
            line: { type: string, nullable: true }
            orderId: { type: string, nullable: true }
            batchId: { type: string, nullable: true }
            productId: { type: string, nullable: true }
            shiftId: { type: string, nullable: true }
        availability: { type: number, nullable: true }
        performance:
          type: number
          nullable: true
          description: Not capped at 1.0
        quality: { type: number, nullable: true }
        oee:
          type: number
          nullable: true
          description: Null when calculation cannot be completed
        calculationStatus:
          type: string
          enum:
            - COMPLETE
            - MISSING_PRODUCTION_CONTEXT
            - MISSING_MACHINE_STATE
            - MISSING_IDEAL_CYCLE
            - MISSING_COUNTER_DATA
            - MISSING_QUALITY_DATA
            - INSUFFICIENT_OBSERVATION
        inputSummary:
          type: object
          properties:
            plannedProductionSeconds: { type: number, nullable: true }
            runtimeSeconds: { type: number, nullable: true }
            idealCycleSeconds: { type: number, nullable: true }
            totalCount: { type: integer, nullable: true }
            goodCount: { type: integer, nullable: true }
            rejectCount: { type: integer, nullable: true }
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
