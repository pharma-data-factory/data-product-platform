apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: oee-data-product
  title: OEE Data Product
  description: Certified Golden Path for OEE (Availability × Performance × Quality) using Wave 1 REST Source, MQTT Consumer, Time-Series Storage, REST API, Health, and Observability.
  tags:
    - recommended
    - python
    - mqtt
    - rest
    - oee
    - fastapi
    - data-product
  annotations:
    dataprod.platform/kind: template
    dataprod.platform/certification-status: CERTIFIED
    dataprod.platform/templateVersion: 1.0.0
    dataprod.platform/dataProductStandardVersion: 1.0.0
    dataprod.platform/dataProductSdkVersion: 1.0.0
    dataprod.platform/category: Templates
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/platform-team
  type: data-product
  parameters:
    - title: OEE Data Product
      description: |
        Certified Golden Path · OEE 1.0.0 · MQTT + REST · Data Contract · Quality Gate · CI/CD · TechDocs

        Fixed architecture: Counter convention CUMULATIVE. MQTT mode Wave 1 MQTT Consumer.
        REST mode Wave 1 REST Source. OEE contract 1.0.0. Domain is manufacturing by default.
        CERTIFIED is technical platform status only. It is not GxP validation.
      required:
        - name
        - description
        - owner
        - domain
        - equipmentId
        - defaultWindow
        - mqttTopic
        - contextUrlRef
        - repoUrl
      properties:
        name:
          title: Data Product Name
          type: string
          description: Unique data product name. Lowercase letters, digits, and dashes only.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of the OEE data product.
          ui:widget: textarea
        owner:
          title: Owner
          type: string
          description: Owning user or group for this Data Product. This is not the GitHub organization.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
        domain:
          title: Domain
          type: string
          description: Business domain.
          default: manufacturing
        equipmentId:
          title: Equipment Identifier
          type: string
          description: Canonical equipmentId used on every OEE input and result.
          default: filler-01
        defaultWindow:
          title: Default Time Window
          type: string
          description: Default calculation window. CURRENT_SHIFT requires from/to at query time.
          default: hour
          enum:
            - hour
            - day
            - shift
            - order
            - custom
        mqttTopic:
          title: MQTT Topic Pattern
          type: string
          description: MQTT subscription topic for machine, count, and quality events.
          default: pharma/oee/+/+
        contextUrlRef:
          title: Production Context URL Reference
          type: string
          description: Name of the runtime environment variable that will hold the MES REST URL. Do not enter the URL or a secret here.
          default: SOURCE_API_URL
        repoUrl:
          title: GitHub Repository
          type: string
          description: The repository is created in the pharma-data-factory organization by the platform GitHub App. Enter only the repository name.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - pharma-data-factory
  steps:
    - id: fetch-base
      name: Fetch OEE data product skeleton
      action: fetch:template
      input:
        url: ./content
        copyWithoutTemplating:
          - .github/workflows/data-product-quality.yml
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          domain: ${{ parameters.domain }}
          equipmentId: ${{ parameters.equipmentId }}
          defaultWindow: ${{ parameters.defaultWindow }}
          mqttTopic: ${{ parameters.mqttTopic }}
          contextUrlRef: ${{ parameters.contextUrlRef }}
          system: data-platform
          lifecycle: experimental
          version: 1.0.0
          destination:
            host: github.com
            owner: pharma-data-factory
            repo: ${{ parameters.name }}
          templateName: oee-data-product
          templateVersion: 1.0.0
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=pharma-data-factory&repo=${{ parameters.name }}
        defaultBranch: main
        repoVisibility: private
        gitAuthorName: Data Product Platform
        gitAuthorEmail: platform@localhost
    - id: register
      name: Register Data Product
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View Data Product
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
