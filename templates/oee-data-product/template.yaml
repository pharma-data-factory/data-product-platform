apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: oee-data-product
  title: OEE Data Product
  description: Certified Golden Path for OEE (Availability × Performance × Quality) using Wave 1 REST Source, MQTT Consumer, Time-Series Storage, REST API, Health, and Observability.
  tags:
    - recommended
    - python
    - mqtt
    - rest
    - oee
    - fastapi
    - data-product
    - manufacturing
    - industrial
  annotations:
    dataprod.platform/kind: template
    dataprod.platform/certification-status: CERTIFIED
    dataprod.platform/templateVersion: 1.0.0
    dataprod.platform/dataProductStandardVersion: 1.0.0
    dataprod.platform/dataProductSdkVersion: 1.0.0
    dataprod.platform/category: Templates
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/platform-team
  type: data-product
  parameters:
    - title: OEE Data Product
      description: |
        Certified Golden Path · OEE 1.0.0 · MQTT + REST · Data Contract · Quality Gate · CI/CD · TechDocs

        The platform owns Availability × Performance × Quality. Create only collects
        deployable identity and integration settings. Do not design OEE formulas here.

        Fixed architecture: Counter convention CUMULATIVE. MQTT mode Wave 1 MQTT Consumer.
        REST mode Wave 1 REST Source. OEE contract 1.0.0. Domain is manufacturing by default.
        CERTIFIED is technical platform status only. It is not GxP validation.

        Included: Quality Loss. Foundation (read-only): stop classification, reason codes
        (diagnostic only), unknown/unobserved time, speed loss, changeover type metadata,
        context. Planned (not configured here): Microstops, Pareto, MTBF/MTTR, reason
        hierarchy, SMED analytics.
      required:
        - name
        - description
        - owner
        - domain
        - equipmentId
        - defaultWindow
        - machineStateTopic
        - counterTopic
        - contextUrlRef
        - repoUrl
      properties:
        name:
          title: Data Product Name
          type: string
          description: Unique data product name. Lowercase letters, digits, and dashes only.
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short description of the OEE data product.
          ui:widget: textarea
        owner:
          title: Owner
          type: string
          description: Owning user or group for this Data Product. This is not the GitHub organization.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
        ursBaselineId:
          title: URS Baseline
          type: string
          description: >-
            Approved URS baseline this data product is built against. Leave empty
            to create the product without one — it can then be built and tested,
            but the release gate will refuse to release it until it references an
            approved baseline.
        system:
          title: System
          type: string
          description: Catalog system this Data Product belongs to.
          default: data-platform
        domain:
          title: Domain
          type: string
          description: Business domain.
          default: manufacturing
        site:
          title: Site
          type: string
          description: Optional site label stored as default context. Not required to calculate OEE.
          default: ""
        area:
          title: Area
          type: string
          description: Optional area label stored as default context.
          default: ""
        line:
          title: Line
          type: string
          description: Optional line label stored as default context.
          default: ""
        equipmentId:
          title: Equipment Identifier
          type: string
          description: Canonical equipmentId used on every OEE input and result.
          default: filler-01
        defaultWindow:
          title: Default Calculation Window
          type: string
          description: Explicit interval type. SHIFT and ORDER require from/to or production context bounds at query time. Formulas are not configurable.
          default: HOUR
          enum:
            - HOUR
            - SHIFT
            - ORDER
            - CUSTOM
        machineStateTopic:
          title: MQTT Machine State Topic
          type: string
          description: Subscription topic for RUNNING / STOPPED / IDLE / MAINTENANCE events.
          default: pharma/oee/+/state
        counterTopic:
          title: MQTT Counter Topic
          type: string
          description: Subscription topic for cumulative total/good/reject counters.
          default: pharma/oee/+/count
        mqttTopic:
          title: Additional MQTT Subscription
          type: string
          description: Optional extra subscription pattern. Leave the default if the two topics above are enough.
          default: pharma/oee/+/+
        contextUrlRef:
          title: Production Context URL Reference
          type: string
          description: Name of the runtime environment variable that will hold the MES REST URL. Do not enter the URL or a secret here.
          default: SOURCE_API_URL
        repoUrl:
          title: GitHub Repository
          type: string
          description: The repository is created in the pharma-data-factory organization by the platform GitHub App. Enter only the repository name.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - pharma-data-factory
  steps:
    - id: fetch-base
      name: Fetch OEE data product skeleton
      action: fetch:template
      input:
        url: ./content
        copyWithoutTemplating:
          - .github/workflows/data-product-quality.yml
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          domain: ${{ parameters.domain }}
          site: ${{ parameters.site }}
          area: ${{ parameters.area }}
          line: ${{ parameters.line }}
          equipmentId: ${{ parameters.equipmentId }}
          defaultWindow: ${{ parameters.defaultWindow }}
          machineStateTopic: ${{ parameters.machineStateTopic }}
          counterTopic: ${{ parameters.counterTopic }}
          mqttTopic: ${{ parameters.mqttTopic }}
          contextUrlRef: ${{ parameters.contextUrlRef }}
          system: ${{ parameters.system }}
          # Always emitted, so an unbound product is explicit in the catalog and
          # can be found rather than merely missing an annotation.
          ursBaselineId: ${{ parameters.ursBaselineId or 'unbound' }}
          lifecycle: experimental
          version: 1.0.0
          destination:
            host: github.com
            owner: pharma-data-factory
            repo: ${{ parameters.name }}
          templateName: oee-data-product
          templateVersion: 1.0.0
    # Before anything is published: a URS claim that does not hold must not
    # reach the catalog. Fails the task unless the baseline is APPROVED.
    # "unbound" passes — creating without a URS is allowed, releasing is not.
    - id: verify-urs
      name: Verify URS baseline
      action: nexora:urs:verify-baseline
      input:
        ursBaselineId: ${{ parameters.ursBaselineId or 'unbound' }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=pharma-data-factory&repo=${{ parameters.name }}
        defaultBranch: main
        repoVisibility: private
        gitAuthorName: Data Product Platform
        gitAuthorEmail: platform@localhost
    - id: register
      name: Register Data Product
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View Data Product
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
