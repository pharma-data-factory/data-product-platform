---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
  title: Guest
  description: Local development fallback identity. Not a production identity.
  annotations:
    dataprod.platform/identity: development-fallback
spec:
  memberOf: [guests, data-product-developers]
# Add GitHub users below. metadata.name must match the GitHub login (lowercase).
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: schmeckm
  title: Markus Schmeckenbecher
  annotations:
    github.com/user-login: schmeckm
spec:
  profile:
    displayName: Markus Schmeckenbecher
  memberOf: [platform-admins]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: viewer
  title: Viewer
  annotations:
    github.com/user-login: viewer
spec:
  profile:
    displayName: Platform Viewer
  memberOf: [platform-viewers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: developer
  title: Developer
  annotations:
    github.com/user-login: developer
spec:
  profile:
    displayName: Data Product Developer
  memberOf: [data-product-developers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: owner
  title: Owner
  annotations:
    github.com/user-login: owner
spec:
  profile:
    displayName: Data Product Owner
  memberOf: [data-product-owners]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: admin
  title: Admin
  annotations:
    github.com/user-login: admin
spec:
  profile:
    displayName: Platform Admin
  memberOf: [platform-admins]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
  title: Guests
  description: Development-only fallback group. Must not be used as a production identity.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-viewers
  title: Platform Viewers
  description: Can view Catalog, APIs, TechDocs, Marketplace, and Data Products.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: data-product-developers
  title: Data Product Developers
  description: Can execute approved Scaffolder templates and create Data Products.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: data-product-owners
  title: Data Product Owners
  description: Can access owner/governance actions and technical certification workflow.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-admins
  title: Platform Admins
  description: Full platform, template, marketplace, and policy administration.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform Team
  description: Catalog owner for official platform entities and generated Data Products.
spec:
  type: team
  children: []
