apiVersion: nexora.dev/v1alpha1
kind: Publisher
metadata:
  namespace: nexora
  displayName: Nexora
  description: >-
    The platform's own publisher. Owns the nexora namespace, which is where the
    Golden Paths, connectors and platform components that ship with the Control
    Plane are registered.
spec:
  # Who may act for this publisher once per-namespace scoping exists. The
  # registry permissions are platform-wide today, so this is recorded and not
  # yet enforced — see NXD-014.
  memberGroups:
    - group:default/data-product-owners
