      version: "0.0.0"
    - ref: "component:default/embeddings"
      version: "0.0.0"
    - ref: "component:default/vector-store"
      version: "0.0.0"
    - ref: "component:default/retriever"
      version: "0.0.0"
    - ref: "component:default/llm-gateway"
      version: "0.0.0"
    - ref: "component:default/rag"
      version: "0.0.0"
