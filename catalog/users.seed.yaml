# Committed Catalog Users. The users-backend edits this file in place (dev);
# metadata.name must match the GitHub login (lowercase).
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
  title: Guest
  description: Local development fallback identity. Not a production identity.
  annotations:
    dataprod.platform/identity: development-fallback
spec:
  memberOf: [guests, data-product-developers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: schmeckm
  title: Markus Schmeckenbecher
  annotations:
    github.com/user-login: schmeckm
spec:
  profile:
    displayName: Markus Schmeckenbecher
  memberOf: [platform-admins]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: viewer
  title: Viewer
  annotations:
    github.com/user-login: viewer
spec:
  profile:
    displayName: Platform Viewer
  memberOf: [platform-viewers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: developer
  title: Developer
  annotations:
    github.com/user-login: developer
spec:
  profile:
    displayName: Data Product Developer
  memberOf: [data-product-developers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: owner
  title: Owner
  annotations:
    github.com/user-login: owner
spec:
  profile:
    displayName: Data Product Owner
  memberOf: [data-product-owners]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: admin
  title: Admin
  annotations:
    github.com/user-login: admin
spec:
  profile:
    displayName: Platform Admin
  memberOf: [platform-admins]
---
# URS domain seed users. Each also holds platform-viewers so base catalog /
# TechDocs reads work; the urs-* group supplies workflow permissions.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: urs-author
  title: URS Author
  annotations:
    github.com/user-login: urs-author
    dataprod.platform/identity: urs-domain-seed
spec:
  profile:
    displayName: URS Author
  memberOf: [platform-viewers, urs-authors]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: urs-business
  title: URS Business Reviewer
  annotations:
    github.com/user-login: urs-business
    dataprod.platform/identity: urs-domain-seed
spec:
  profile:
    displayName: URS Business Reviewer
  memberOf: [platform-viewers, urs-business-reviewers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: urs-pm
  title: URS Product Manager
  annotations:
    github.com/user-login: urs-pm
    dataprod.platform/identity: urs-domain-seed
spec:
  profile:
    displayName: URS Product Manager
  memberOf: [platform-viewers, urs-product-managers]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: urs-qa
  title: URS Quality Reviewer
  annotations:
    github.com/user-login: urs-qa
    dataprod.platform/identity: urs-domain-seed
spec:
  profile:
    displayName: URS Quality Reviewer
  memberOf: [platform-viewers, urs-quality-reviewers]
