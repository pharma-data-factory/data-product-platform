# Official Golden Path releases. Version-controlled. No secrets.
# CERTIFIED = conforms to the Data Product Standard.
# RELEASED = a certified version approved for consumption.
# Neither status is GxP or regulatory validation.

releases:
  - template: mqtt-temperature-data-product
    name: MQTT Temperature Data Product
    version: "1.0.0"
    status: RELEASED
    certification:
      status: CERTIFIED
      standard: "1.0.x"
      sdk: "1.x"
    distribution:
      - INTERNAL
      - TEMPLATE_EDITION
    release:
      date: "2026-08"
      notes: docs/releases/mqtt-temperature-1.0.0.md
    changelog:
      breaking: []
      capabilities:
        - MQTT temperature Golden Path with temperature-event contract
        - Quality gates, CI/CD, Docker, and TechDocs
      fixes: []
      migration: No migration. First released line.

