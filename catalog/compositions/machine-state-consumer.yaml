apiVersion: dataprod.platform/v1alpha1
kind: GoldenPathComposition

metadata:
  name: machine-state-consumer
  title: Machine State Consumer
  description: >
    Composition proof that a Data Product can depend on Unified Namespace.
    REST API and Observability Platform Components are not composed here
    because they are Catalog placeholders, not reusable runtimes.
    This is not an OEE implementation.

spec:
  standardVersion: 1.0.0
  components:
    - ref: component:default/unified-namespace
      version: 1.x
