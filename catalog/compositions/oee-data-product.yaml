apiVersion: dataprod.platform/v1alpha1
kind: GoldenPathComposition

metadata:
  name: oee-data-product
  title: Packaging OEE (UNS optional Mode B example)
  description: >
    Mode B example only. Unified Namespace is OPTIONAL and remains DEVELOPMENT.
    Do not treat this as the OEE MVP composition. See oee-data-product-direct.yaml.
    No OEE calculations are implemented.

spec:
  standardVersion: 1.0.0
  components:
    - ref: component:default/rest-source
      version: 1.x
    - ref: component:default/mqtt-consumer
      version: 1.x
    - ref: component:default/unified-namespace
      version: 1.x
    - ref: component:default/timeseries
      version: 1.x
    - ref: component:default/rest-api
      version: 1.x
    - ref: component:default/health
      version: 1.x
    - ref: component:default/observability
      version: 1.x
