# Raises the local Guest from VIEWER to DEVELOPER.
#
# Opt-in on top of app-config.guest.yaml, loaded only when the .env sets
# AUTH_GUEST_ROLE=developer. Use it to exercise the URS → Product → Create
# journey locally without a GitHub OAuth App.
#
# This grants scaffolder.task.create, catalog.entity.create, data-product.create
# and urs.create/urs.manage to an identity that nobody approved. Local
# development only — never in the production image, and never on a shared host.
# users-backend refuses to apply this when auth.environment is production.
#
# It works by writing the groups onto the Guest's row in `platform_users`, which
# the Catalog projection is generated from. That is not a detour: the upstream
# guest sign-in resolver calls `signInWithCatalogUser` and only falls back to
# `auth.providers.guest.ownershipEntityRefs` when that lookup *fails*. Guest is
# in the catalog, so the fallback never runs. This file used to list
# ownershipEntityRefs and nothing else, and consequently did nothing at all —
# the issued token still said platform-viewers. See plugins/users-backend/src/guestRole.ts.
users:
  guestGroups:
    - guests
    # DEVELOPER: scaffold, create catalog entities, create data products.
    - data-product-developers
    # Author and baseline a URS. Without this the Define journey is read-only.
    - urs-authors
    # NXD-166. Not data-product-owners: this file is called "developer" and
    # gave DATA_PRODUCT_OWNER, so a Guest set to developer could approve and
    # release product versions. The owner tier is AUTH_GUEST_ROLE=owner,
    # app-config.guest-owner.yaml.

    # Approving a baseline is deliberately NOT granted above.
    #
    # Each approval step requires its own role and ADMIN does not bypass the
    # check (`approveApprovalStep`), because an approval chain one person can
    # walk alone proves nothing. Locally there is no second identity to switch
    # to without GitHub OAuth, so uncomment these three to walk the chain
    # end-to-end — and be clear with yourself that doing so defeats segregation
    # of duties and makes the resulting signatures worthless as evidence.
    #
    # - urs-business-reviewers
    # - urs-product-managers
    # - urs-quality-reviewers

# Removing this file from the config list does not demote a Guest it already
# raised — the groups are in the database, where a restart cannot overwrite
# them. Lower it in Admin → Users & Roles, or delete the local .sqlite.

# The frontend reads this to decide whether to offer the Guest sign-in button.
# The ownership list that used to live here is gone: it was never read on the
# path that runs.
auth:
  providers:
    guest:
      # @visibility frontend
      userEntityRef: user:default/guest
