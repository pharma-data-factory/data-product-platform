name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    # The URS and Validation suites carry the GxP invariants, the persistence
    # proofs and the URS -> Validation integration. They skip themselves when
    # PostgreSQL does not answer, so without this service 62 tests were quietly
    # skipped in every run while the pipeline still reported green. The
    # credentials and port match the defaults in
    # plugins/urs-composer-backend/src/__testUtils__/testDatabase.ts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urs_test
          POSTGRES_PASSWORD: test_pass123
          POSTGRES_DB: urs_composer_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U urs_test -d urs_composer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Platform guardrails
        run: yarn guard:platform

      - name: Typecheck
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK
        run: python -m pip install pydantic 'jsonschema[format]' -e packages/data-product-sdk

      - name: Unit tests
        run: yarn test:all --watchAll=false

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc

      - name: Build backend bundle
        run: yarn build:backend

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "mvp_tag=mvp-1.0" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.mvp_tag }}

      # Phase 5 closure (Slice 3): CI evidence reaches the ProductBaseline.
      #
      # Until now `releaseCommitSha` and `artifactDigest` existed on the
      # baseline snapshot and nothing wrote them — the only writers were a
      # request body and a copy from the version row, so a field meant to
      # identify one build was whatever a human last typed. This is the step
      # that makes the system which produced the artifact the system that
      # names it.
      #
      # `continue-on-error` is deliberate and is the mitigation named in the
      # closure plan: this is the first time CI writes back into the platform,
      # and an unreachable Composer must not turn a good build red. A missing
      # record surfaces at the release gate as MISSING_CI_PROVENANCE, where a
      # human is already looking — the same fail-visible placement 5-R1 chose
      # for policy resolution.
      #
      # Inert until a deployment configures the three values. That is honest
      # rather than convenient: the platform's own baseline id is not knowable
      # when this file is written, so the step says it is unconfigured instead
      # of pretending to have posted.
      - name: Record release provenance on the ProductBaseline
        continue-on-error: true
        env:
          COMPOSER_URL: ${{ secrets.NEXORA_COMPOSER_URL }}
          PROVENANCE_TOKEN: ${{ secrets.NEXORA_PROVENANCE_TOKEN }}
          BASELINE_ID: ${{ vars.NEXORA_BASELINE_ID }}
          ARTIFACT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -u
          if [ -z "${COMPOSER_URL}" ] || [ -z "${PROVENANCE_TOKEN}" ] || [ -z "${BASELINE_ID}" ]; then
            echo "Release provenance not configured (NEXORA_COMPOSER_URL / NEXORA_PROVENANCE_TOKEN / NEXORA_BASELINE_ID)."
            echo "Skipping. The release gate will report MISSING_CI_PROVENANCE if a policy requires it."
            exit 0
          fi
          echo "Recording provenance for commit ${GITHUB_SHA} (${ARTIFACT_DIGEST}) on baseline ${BASELINE_ID}"
          status=$(curl --silent --show-error --location \
            --output /tmp/provenance-response.json \
            --write-out '%{http_code}' \
            --max-time 30 \
            --request POST "${COMPOSER_URL}/api/composer/baselines/${BASELINE_ID}/provenance" \
            --header "Authorization: Bearer ${PROVENANCE_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$(printf '{"releaseCommitSha":"%s","artifactDigest":"%s"}' "${GITHUB_SHA}" "${ARTIFACT_DIGEST}")")
          echo "HTTP ${status}"
          cat /tmp/provenance-response.json
          echo
          # 409 means this baseline already carries different evidence. That is
          # a real conflict a person has to resolve, but it must not fail the
          # image job — the image is already built and pushed by this point.
          if [ "${status}" = "409" ]; then
            echo "::warning::Baseline ${BASELINE_ID} already carries provenance for a different build."
          elif [ "${status}" != "200" ]; then
            echo "::warning::Provenance was not recorded (HTTP ${status})."
          fi

      # MVP1-B (Slice B-4b): test evidence reaches the requirement.
      #
      # The companion to the provenance step above and the same bargain:
      # `continue-on-error`, because an unreachable Composer must not redden
      # a build whose tests actually passed. A missing record surfaces at the
      # release gate as INCOMPLETE_TRACEABILITY, where a human is already
      # looking — the fail-visible placement 5-R1 chose for policy
      # resolution and Slice 3 chose for provenance.
      #
      # `NEXORA_EVIDENCE_MAP` is the join this platform cannot make for you:
      # only the pipeline knows which of its test cases exercises which URS
      # requirement version. One `requirementVersionId=suite::case` per line.
      # Unconfigured means inert, and it says so rather than pretending.
      #
      # One correlation id for the whole run, so the trail can answer "what
      # did this build verify" as one operation rather than N unrelated ones.
      # That is the cross-plugin thread NXD-065 left open.
      - name: Record test evidence against URS requirements
        continue-on-error: true
        env:
          COMPOSER_URL: ${{ secrets.NEXORA_COMPOSER_URL }}
          PROVENANCE_TOKEN: ${{ secrets.NEXORA_PROVENANCE_TOKEN }}
          EVIDENCE_MAP: ${{ vars.NEXORA_EVIDENCE_MAP }}
        run: |
          set -u
          if [ -z "${COMPOSER_URL}" ] || [ -z "${PROVENANCE_TOKEN}" ] || [ -z "${EVIDENCE_MAP}" ]; then
            echo "Test evidence reporting not configured (NEXORA_COMPOSER_URL / NEXORA_PROVENANCE_TOKEN / NEXORA_EVIDENCE_MAP)."
            echo "Skipping. The release gate will report INCOMPLETE_TRACEABILITY for requirements with no evidence."
            exit 0
          fi
          correlation="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          executed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          artifact="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "${EVIDENCE_MAP}" | while IFS= read -r line; do
            [ -z "${line}" ] && continue
            requirement="${line%%=*}"
            locator="${line#*=}"
            suite="${locator%%::*}"
            case_name="${locator#*::}"
            # The unit-test job is a dependency of this job, so reaching here
            # at all means it passed. A failed build never posts PASSED.
            status=$(curl --silent --show-error --location \
              --output /tmp/evidence-response.json \
              --write-out '%{http_code}' \
              --max-time 30 \
              --request POST "${COMPOSER_URL}/api/composer/test-executions" \
              --header "Authorization: Bearer ${PROVENANCE_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(printf '{"requirementVersionId":"%s","testSuite":"%s","testCase":"%s","status":"PASSED","executedAt":"%s","executionArtifactUrl":"%s","correlationId":"%s"}' \
                "${requirement}" "${suite}" "${case_name}" "${executed_at}" "${artifact}" "${correlation}")")
            if [ "${status}" = "201" ]; then
              echo "Recorded ${requirement} (${suite}::${case_name})"
            else
              echo "::warning::Evidence for ${requirement} was not recorded (HTTP ${status})."
              cat /tmp/evidence-response.json || true
              echo
            fi
          done
