name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    # The URS and Validation suites carry the GxP invariants, the persistence
    # proofs and the URS -> Validation integration. They skip themselves when
    # PostgreSQL does not answer, so without this service 62 tests were quietly
    # skipped in every run while the pipeline still reported green. The
    # credentials and port match the defaults in
    # plugins/urs-composer-backend/src/__testUtils__/testDatabase.ts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urs_test
          POSTGRES_PASSWORD: test_pass123
          POSTGRES_DB: urs_composer_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U urs_test -d urs_composer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Platform guardrails
        run: yarn guard:platform

      - name: Typecheck
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python SDK
        run: python -m pip install pydantic 'jsonschema[format]' -e packages/data-product-sdk

      # `test:all` already passes --coverage, so the coverageThreshold in the
      # root package.json is enforced here. It is set just under the measured
      # figures (statements 66.9%, branches 56.6%, functions 57.4%) — a ratchet
      # against regression, not a target.
      - name: Unit tests
        run: yarn test:all --watchAll=false

      # Deliberately not a hard gate yet, and that is a finding rather than an
      # oversight. The tree already carries critical and high advisories, all
      # of them transitive through Backstage's own dependencies — node-gyp ->
      # tar, ajv -> fast-uri, @module-federation -> adm-zip. Clearing them
      # means moving @backstage/* versions, which AGENTS.md routes through a
      # dedicated Backstage upgrade gate rather than an ad-hoc bump.
      #
      # So this step does the part that is available today: it makes the list
      # visible on every run, and Dependabot (.github/dependabot.yml) raises
      # the PRs. Turn `continue-on-error` off once the backlog is empty —
      # that is the moment it becomes a gate.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          yarn npm audit --all --recursive --severity high || \
            echo "::warning::Dependency advisories present. See the step log; remediation runs through the Backstage upgrade gate."

  # The URS approval chain, walked in a browser by three identities on real
  # PostgreSQL (NXD-097). Every decision record from NXD-055 on ended "not
  # verified against a running stack"; this is the job that verifies it. Its
  # first local runs found two defects no unit test could: the demo sign-in
  # buttons never rendered, and a created baseline did not appear until reload.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: e2e_pass
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: e2e_pass
      POSTGRES_DATABASE: nexora
      # Throwaway, per run: signs service tokens inside this job only.
      BACKEND_SECRET: e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # The backend serves this bundle from its own origin, as the production
      # image does; Playwright's CI baseURL is http://localhost:7007.
      - name: Build frontend
        run: yarn workspace app build

      # Not `yarn workspace backend start`: that script reads ../../.env,
      # which does not exist here, and node refuses a missing --env-file.
      - name: Start backend (demo + e2e profile)
        working-directory: packages/backend
        run: |
          node ../../node_modules/@backstage/cli/bin/backstage-cli package start \
            --config ../../app-config.yaml \
            --config ../../app-config.demo.yaml \
            --config ../../app-config.e2e.yaml > ../../backend-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:7007/.backstage/health/v1/readiness >/dev/null; then
              echo "backend ready after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::backend did not become ready"; tail -100 ../../backend-e2e.log; exit 1

      # Only this spec: the model-company journeys need the simulator stack.
      # Google Chrome is preinstalled on ubuntu-latest, which is the channel
      # @backstage/e2e-test-utils' generateProjects selects.
      - name: URS approval chain (Playwright)
        run: yarn playwright test packages/app/e2e-tests/urs-approval-chain.spec.ts

      - name: Upload report and backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-urs-approval-chain
          path: |
            e2e-test-report/
            node_modules/.cache/e2e-test-results/
            backend-e2e.log
          retention-days: 7

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Trivy uploads its findings to the Security tab rather than printing
      # them into a log nobody reads after the run is green.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc

      - name: Build backend bundle
        run: yarn build:backend

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "mvp_tag=mvp-1.0" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.mvp_tag }}
          # A GxP release needs to be able to answer "what was in this image"
          # years later. Both are attached to the image in the registry, so
          # the answer travels with the artifact instead of living in a CI log
          # that ages out.
          sbom: true
          provenance: mode=max

      # Reports rather than blocks, for the same reason as the dependency
      # audit: the base image and the Backstage tree carry advisories that
      # cannot be cleared from this pipeline. Findings land in the Security
      # tab, where they accumulate visibly instead of scrolling past.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Phase 5 closure (Slice 3): CI evidence reaches the ProductBaseline.
      #
      # Until now `releaseCommitSha` and `artifactDigest` existed on the
      # baseline snapshot and nothing wrote them — the only writers were a
      # request body and a copy from the version row, so a field meant to
      # identify one build was whatever a human last typed. This is the step
      # that makes the system which produced the artifact the system that
      # names it.
      #
      # `continue-on-error` is deliberate and is the mitigation named in the
      # closure plan: this is the first time CI writes back into the platform,
      # and an unreachable Composer must not turn a good build red. A missing
      # record surfaces at the release gate as MISSING_CI_PROVENANCE, where a
      # human is already looking — the same fail-visible placement 5-R1 chose
      # for policy resolution.
      #
      # Inert until a deployment configures the three values. That is honest
      # rather than convenient: the platform's own baseline id is not knowable
      # when this file is written, so the step says it is unconfigured instead
      # of pretending to have posted.
      - name: Record release provenance on the ProductBaseline
        continue-on-error: true
        env:
          COMPOSER_URL: ${{ secrets.NEXORA_COMPOSER_URL }}
          PROVENANCE_TOKEN: ${{ secrets.NEXORA_PROVENANCE_TOKEN }}
          BASELINE_ID: ${{ vars.NEXORA_BASELINE_ID }}
          ARTIFACT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -u
          if [ -z "${COMPOSER_URL}" ] || [ -z "${PROVENANCE_TOKEN}" ] || [ -z "${BASELINE_ID}" ]; then
            echo "Release provenance not configured (NEXORA_COMPOSER_URL / NEXORA_PROVENANCE_TOKEN / NEXORA_BASELINE_ID)."
            echo "Skipping. The release gate will report MISSING_CI_PROVENANCE if a policy requires it."
            exit 0
          fi
          echo "Recording provenance for commit ${GITHUB_SHA} (${ARTIFACT_DIGEST}) on baseline ${BASELINE_ID}"
          status=$(curl --silent --show-error --location \
            --output /tmp/provenance-response.json \
            --write-out '%{http_code}' \
            --max-time 30 \
            --request POST "${COMPOSER_URL}/api/composer/baselines/${BASELINE_ID}/provenance" \
            --header "Authorization: Bearer ${PROVENANCE_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$(printf '{"releaseCommitSha":"%s","artifactDigest":"%s"}' "${GITHUB_SHA}" "${ARTIFACT_DIGEST}")")
          echo "HTTP ${status}"
          cat /tmp/provenance-response.json
          echo
          # 409 means this baseline already carries different evidence. That is
          # a real conflict a person has to resolve, but it must not fail the
          # image job — the image is already built and pushed by this point.
          if [ "${status}" = "409" ]; then
            echo "::warning::Baseline ${BASELINE_ID} already carries provenance for a different build."
          elif [ "${status}" != "200" ]; then
            echo "::warning::Provenance was not recorded (HTTP ${status})."
          fi

      # MVP1-B (Slice B-4b): test evidence reaches the requirement.
      #
      # The companion to the provenance step above and the same bargain:
      # `continue-on-error`, because an unreachable Composer must not redden
      # a build whose tests actually passed. A missing record surfaces at the
      # release gate as INCOMPLETE_TRACEABILITY, where a human is already
      # looking — the fail-visible placement 5-R1 chose for policy
      # resolution and Slice 3 chose for provenance.
      #
      # `NEXORA_EVIDENCE_MAP` is the join this platform cannot make for you:
      # only the pipeline knows which of its test cases exercises which URS
      # requirement version. One `requirementVersionId=suite::case` per line.
      # Unconfigured means inert, and it says so rather than pretending.
      #
      # One correlation id for the whole run, so the trail can answer "what
      # did this build verify" as one operation rather than N unrelated ones.
      # That is the cross-plugin thread NXD-065 left open.
      - name: Record test evidence against URS requirements
        continue-on-error: true
        env:
          COMPOSER_URL: ${{ secrets.NEXORA_COMPOSER_URL }}
          PROVENANCE_TOKEN: ${{ secrets.NEXORA_PROVENANCE_TOKEN }}
          EVIDENCE_MAP: ${{ vars.NEXORA_EVIDENCE_MAP }}
        run: |
          set -u
          if [ -z "${COMPOSER_URL}" ] || [ -z "${PROVENANCE_TOKEN}" ] || [ -z "${EVIDENCE_MAP}" ]; then
            echo "Test evidence reporting not configured (NEXORA_COMPOSER_URL / NEXORA_PROVENANCE_TOKEN / NEXORA_EVIDENCE_MAP)."
            echo "Skipping. The release gate will report INCOMPLETE_TRACEABILITY for requirements with no evidence."
            exit 0
          fi
          correlation="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          executed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          artifact="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "${EVIDENCE_MAP}" | while IFS= read -r line; do
            [ -z "${line}" ] && continue
            requirement="${line%%=*}"
            locator="${line#*=}"
            suite="${locator%%::*}"
            case_name="${locator#*::}"
            # The unit-test job is a dependency of this job, so reaching here
            # at all means it passed. A failed build never posts PASSED.
            status=$(curl --silent --show-error --location \
              --output /tmp/evidence-response.json \
              --write-out '%{http_code}' \
              --max-time 30 \
              --request POST "${COMPOSER_URL}/api/composer/test-executions" \
              --header "Authorization: Bearer ${PROVENANCE_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(printf '{"requirementVersionId":"%s","testSuite":"%s","testCase":"%s","status":"PASSED","executedAt":"%s","executionArtifactUrl":"%s","correlationId":"%s"}' \
                "${requirement}" "${suite}" "${case_name}" "${executed_at}" "${artifact}" "${correlation}")")
            if [ "${status}" = "201" ]; then
              echo "Recorded ${requirement} (${suite}::${case_name})"
            else
              echo "::warning::Evidence for ${requirement} was not recorded (HTTP ${status})."
              cat /tmp/evidence-response.json || true
              echo
            fi
          done
